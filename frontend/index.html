<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>DeepSpeak — 英语深度学习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  // 主题防闪烁：首帧前按 localStorage 应用白天/黑夜
  try {
    if (localStorage.getItem("ds_theme") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) { /* ignore */ }
</script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">🎧</span><div><div class="logo-name">DeepSpeak</div><div class="logo-sub">英语深度学习</div></div></div>
    <nav>
      <a href="#/" data-nav="today" class="nav-item"><span class="nav-ico">🏠</span><span class="nav-label">今日</span></a>
      <a href="#/materials" data-nav="materials" class="nav-item"><span class="nav-ico">📚</span><span class="nav-label">材料</span></a>
      <a href="#/review" data-nav="review" class="nav-item"><span class="nav-ico">🔁</span><span class="nav-label">复习</span><span id="nav-review-badge" class="nav-badge hidden"></span></a>
      <a href="#/stats" data-nav="stats" class="nav-item"><span class="nav-ico">📊</span><span class="nav-label">统计</span></a>
      <a href="#/settings" data-nav="settings" class="nav-item"><span class="nav-ico">⚙️</span><span class="nav-label">设置</span></a>
    </nav>
    <div class="sidebar-foot">本地优先 · 无需 API Key</div>
  </aside>
  <main id="view"><div class="loading">加载中…</div></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="recorder.js"></script>
<script src="engine-data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="explainer.js"></script>
<script>
// PWA 离线支持（https 或本机 localhost 才注册；file:// 打开时静默跳过，功能不受影响）
if ("serviceWorker" in navigator && ["localhost", "127.0.0.1"].includes(location.hostname) || location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
