<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>DeepSpeak — 英语深度学习</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<script>
  // 主题防闪烁：首帧前按 localStorage 应用白天/黑夜
  try {
    if (localStorage.getItem("ds_theme") === "light") document.documentElement.dataset.theme = "light";
  } catch (e) { /* ignore */ }
</script>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo"><span class="logo-mark">🎧</span><div><div class="logo-name">DeepSpeak</div><div class="logo-sub">英语深度学习</div></div></div>
    <nav>
      <a href="#/" data-nav="today" class="nav-item">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span class="nav-label">今日</span></a>
      <a href="#/materials" data-nav="materials" class="nav-item">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h11a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M8 8h7M8 12h7M8 16h4"/></svg>
        <span class="nav-label">材料</span></a>
      <a href="#/review" data-nav="review" class="nav-item">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 3v6h-6"/></svg>
        <span class="nav-label">复习</span><span id="nav-review-badge" class="nav-badge hidden"></span></a>
      <a href="#/stats" data-nav="stats" class="nav-item">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21v-7M11 21V5M16 21v-11M21 21V9"/></svg>
        <span class="nav-label">统计</span></a>
      <a href="#/settings" data-nav="settings" class="nav-item">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span class="nav-label">设置</span></a>
    </nav>
  </aside>
  <main id="view"><div class="loading">加载中…</div></main>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="recorder.js"></script>
<script src="engine-data.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
<script src="explainer.js"></script>
<script>
// PWA 离线支持（https 或本机 localhost 才注册；file:// 打开时静默跳过，功能不受影响）
if ("serviceWorker" in navigator && ["localhost", "127.0.0.1"].includes(location.hostname) || location.protocol === "https:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
