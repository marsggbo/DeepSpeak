name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 构建后端侧车（PyInstaller）
        run: packaging\build_win.bat

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 构建 exe（electron-builder）
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 上传 exe 产物
        uses: actions/upload-artifact@v4
        with:
          name: deepspeak-windows-exe
          path: |
            electron/release/*.exe
            electron/release/*.blockmap
            electron/release/*.yml

      - name: 上传到 GitHub Release（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          gh release upload "${GITHUB_REF_NAME}" electron/release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
